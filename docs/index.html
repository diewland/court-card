<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PA Reader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="layout">
    <section class="input">
      <header class="intro">
        <h1>PA Reader</h1>
      </header>
      <textarea id="note" spellcheck="false" rows="18" placeholder="วางโน้ตลงชื่อประจำวัน"></textarea>
      <div class="actions">
        <button id="view" type="button" class="secondary">View: Court</button>
      </div>
    </section>
    <section class="output">
      <div id="card" class="card" aria-live="polite"></div>
      <div id="unknown" class="unknown"></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
