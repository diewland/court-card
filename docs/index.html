<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Court Card</title>
  <meta name="description" content="วางโน้ตลงชื่อเล่นเทนนิสจากแชท แล้วได้ตารางจองคอร์ทพร้อมรายชื่อสำรองทันที">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Court Card">
  <meta property="og:title" content="Court Card">
  <meta property="og:description" content="วางโน้ตลงชื่อเล่นเทนนิสจากแชท แล้วได้ตารางจองคอร์ทพร้อมรายชื่อสำรองทันที">
  <meta property="og:url" content="https://diewland.github.io/court-card/">
  <meta property="og:locale" content="th_TH">
  <meta property="og:image" content="https://diewland.github.io/court-card/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Court Card: ตารางจองคอร์ทเทนนิสพร้อมแถวสำรอง">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Court Card">
  <meta name="twitter:image" content="https://diewland.github.io/court-card/og.png">
  <meta name="twitter:description" content="วางโน้ตลงชื่อเล่นเทนนิสจากแชท แล้วได้ตารางจองคอร์ทพร้อมรายชื่อสำรองทันที">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="layout">
    <section class="input">
      <header class="intro">
        <h1>Court Card</h1>
      </header>
      <div class="notes">
        <div class="field">
          <textarea id="note" spellcheck="false" rows="15" placeholder="วางโน้ตลงชื่อประจำวัน" aria-label="โน้ตลงชื่อ"></textarea>
          <button id="clear-note" type="button" class="x" aria-label="ล้างโน้ต" title="ล้าง" hidden><svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><line x1="2" y1="2" x2="10" y2="10"/><line x1="10" y1="2" x2="2" y2="10"/></svg></button>
        </div>
        <div class="field">
          <textarea id="reserve" spellcheck="false" rows="3" placeholder="วางรายชื่อสำรอง (ถ้ามี)" aria-label="รายชื่อสำรอง"></textarea>
          <button id="clear-reserve" type="button" class="x" aria-label="ล้างรายชื่อสำรอง" title="ล้าง" hidden><svg viewBox="0 0 12 12" width="12" height="12" aria-hidden="true"><line x1="2" y1="2" x2="10" y2="10"/><line x1="10" y1="2" x2="2" y2="10"/></svg></button>
        </div>
      </div>
      <div class="actions">
        <button id="clear" type="button" class="secondary">Clear</button>
        <button id="rain" type="button" class="secondary" aria-pressed="false" title="งดเล่นเพราะฝนตก">Rain</button>
        <button id="save" type="button">Share</button>
      </div>
    </section>
    <section class="output">
      <div id="card" class="card" aria-live="polite"></div>
      <div id="unknown" class="unknown"></div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.13/dist/html-to-image.js" defer></script>
  <script src="app.js"></script>
</body>
</html>
